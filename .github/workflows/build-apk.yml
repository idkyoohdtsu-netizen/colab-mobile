name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ColabMobile-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColabMobile-APK
          path: release/ColabMobile-debug.apk
          retention-days: 30

      - name: Create Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            🤖 Tự động build từ commit `${{ github.sha }}`

            📱 **Cách cài APK:**
            1. Tải file `ColabMobile-debug.apk` bên dưới
            2. Vào Cài đặt > Bảo mật > Bật "Cài từ nguồn không rõ"
            3. Mở file APK để cài đặt

            ✨ **Tính năng:**
            - Hiển thị giao diện máy tính (desktop) trên điện thoại
            - Nút bấm được phóng to cho ngón tay
            - Thanh URL + nút Quay lại / Tiến / Làm mới
            - Hỗ trợ Google Colab, Drive, tất cả trang web
          files: release/ColabMobile-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
